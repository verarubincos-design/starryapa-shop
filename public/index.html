<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>StarryApa みんなで歩けるお店</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1214; font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; color: #f5ead9; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  /* ---------- ログイン / 登録 / ロビー ---------- */
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 35%, #3d2126 0%, #1a1214 70%); z-index: 50; padding: 16px; overflow-y: auto; }
  .card { background: rgba(43, 26, 30, 0.95); border: 1px solid #7a4a52; border-radius: 16px; padding: 24px 22px; width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }
  .card h1 { font-size: 20px; text-align: center; margin-bottom: 4px; color: #ffd9a0; }
  .card .sub { text-align: center; font-size: 12px; color: #c9a8a0; margin-bottom: 18px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
  .tabs button { flex: 1; padding: 9px; border-radius: 9px; border: 1px solid #7a4a52; background: transparent; color: #c9a8a0; font-size: 14px; }
  .tabs button.active { background: #7a2d3a; color: #fff; border-color: #a04a58; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #f0d7c0; }
  .hint { font-size: 11px; color: #b08d84; margin-top: 2px; }
  input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid #7a4a52; background: #241417; color: #fff; font-size: 16px; }
  .big-btn { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 10px; background: #a83a4a; color: #fff; font-size: 16px; font-weight: bold; }
  .big-btn:hover { background: #bf4657; }
  .ghost-btn { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #7a4a52; border-radius: 10px; background: transparent; color: #c9a8a0; font-size: 14px; }
  .error { color: #ff9d9d; font-size: 13px; min-height: 18px; margin-top: 10px; text-align: center; }
  .avatar-choices { display: flex; gap: 8px; margin-top: 6px; }
  .avatar-choices button { flex: 1; padding: 9px 4px; border-radius: 9px; border: 2px solid #5a3a40; background: #241417; color: #e8cdb8; font-size: 14px; }
  .avatar-choices button.active { border-color: #ffd9a0; background: #3d2126; }
  .colors { display: flex; gap: 10px; margin-top: 8px; }
  .colors button { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
  .colors button.active { border-color: #fff; box-shadow: 0 0 0 2px #ffd9a0; }
  .hidden { display: none !important; }

  /* ---------- 部屋 ---------- */
  #room { position: fixed; inset: 0; }
  #room canvas { display: block; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1214; z-index: 40; font-size: 15px; gap: 10px; }
  .hud-btn { background: rgba(30, 18, 20, 0.78); color: #f5ead9; border: 1px solid rgba(255, 217, 160, 0.4); border-radius: 9px; padding: 7px 12px; font-size: 13px; }
  #count { position: fixed; top: 10px; left: 10px; z-index: 20; background: rgba(30,18,20,0.78); border: 1px solid rgba(255,217,160,0.4); border-radius: 9px; padding: 6px 12px; font-size: 13px; }
  #topRight { position: fixed; top: 10px; right: 10px; z-index: 20; display: flex; gap: 6px; }
  #menuPanel { position: fixed; top: 52px; right: 10px; z-index: 21; display: flex; flex-direction: column; gap: 6px; background: rgba(30,18,20,0.92); border: 1px solid rgba(255,217,160,0.4); border-radius: 12px; padding: 10px; }
  #helpCard { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); z-index: 22; width: min(92vw, 400px); background: rgba(30,18,20,0.94); border: 1px solid rgba(255,217,160,0.5); border-radius: 14px; padding: 16px 18px; font-size: 13px; line-height: 1.8; }
  #helpCard h2 { font-size: 15px; color: #ffd9a0; margin-bottom: 6px; }
  #helpCard button { margin-top: 10px; width: 100%; }
  #chatLog { position: fixed; left: 10px; bottom: 64px; z-index: 15; width: min(78vw, 340px); max-height: 34vh; overflow-y: auto; background: rgba(20, 12, 14, 0.55); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.55; }
  #chatLog .who { color: #ffd9a0; }
  #chatBar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 16; display: flex; gap: 6px; width: min(94vw, 520px); }
  #chatInput { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,217,160,0.4); background: rgba(30,18,20,0.85); color: #fff; font-size: 16px; }
  #chatSend { padding: 10px 16px; border-radius: 10px; border: none; background: #a83a4a; color: #fff; font-size: 14px; font-weight: bold; }
  #stick { position: fixed; left: 18px; bottom: 120px; z-index: 16; width: 104px; height: 104px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,217,160,0.35); display: none; }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,217,160,0.45); transform: translate(-50%, -50%); }
  body.touch #stick { display: block; }
  body.touch #chatLog { bottom: 240px; max-height: 24vh; }
  #errBox { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; background: rgba(10,6,8,0.9); padding: 20px; text-align: center; font-size: 14px; line-height: 1.9; }
</style>
</head>
<body>

<!-- ログイン / 登録 -->
<div id="authScreen" class="screen">
  <div class="card">
    <h1>StarryApa</h1>
    <div class="sub">みんなで歩ける小さなお店</div>
    <div class="tabs">
      <button id="tabLogin" class="active">ログイン</button>
      <button id="tabRegister">新規登録</button>
    </div>
    <div id="loginForm">
      <label>ログインID</label>
      <input type="text" id="loginId" autocomplete="username" placeholder="登録したログインID">
      <label>パスワード</label>
      <input type="password" id="loginPw" autocomplete="current-password">
      <button class="big-btn" id="doLogin">ログイン</button>
      <div class="error" id="loginError"></div>
    </div>
    <div id="registerForm" class="hidden">
      <label>ログインID</label>
      <input type="text" id="regId" autocomplete="username" placeholder="例：vera">
      <div class="hint">ログインする時だけ使うもの。人には見えません</div>
      <label>パスワード</label>
      <input type="password" id="regPw" autocomplete="new-password">
      <div class="hint">4文字以上なら何でもOKです</div>
      <label>名前（カタカナ）</label>
      <input type="text" id="regName" value="ベラ">
      <div class="hint">部屋で頭の上に表示される、みんなに見える名前</div>
      <label>アバター</label>
      <div class="avatar-choices" id="avatarChoices">
        <button data-type="vera" class="active">ベラ</button>
        <button data-type="girl">女の子</button>
        <button data-type="boy">男の子</button>
      </div>
      <label>色（ドレス／シャツ）</label>
      <div class="colors" id="colorChoices">
        <button data-color="violet" class="active" style="background:#8a6fc9" title="むらさき"></button>
        <button data-color="red" style="background:#c23b47" title="あか"></button>
        <button data-color="blue" style="background:#4070cc" title="あお"></button>
        <button data-color="green" style="background:#4da653" title="みどり"></button>
        <button data-color="yellow" style="background:#e6bf3f" title="きいろ"></button>
      </div>
      <button class="big-btn" id="doRegister">登録して入る</button>
      <div class="error" id="regError"></div>
    </div>
  </div>
</div>

<!-- ロビー -->
<div id="lobbyScreen" class="screen hidden">
  <div class="card">
    <h1>StarryApa</h1>
    <div class="sub" id="lobbyInfo">ログイン中</div>
    <button class="big-btn" id="doEnter">入室する</button>
    <button class="ghost-btn" id="doLogout">ログアウト</button>
  </div>
</div>

<!-- 部屋 -->
<div id="room" class="hidden"></div>
<div id="loading" class="hidden"><div>お部屋を準備しています…</div><div id="loadPct">0%</div></div>
<div id="count" class="hidden">いま0人</div>
<div id="topRight" class="hidden">
  <button class="hud-btn" id="btnReset">入口にもどす</button>
  <button class="hud-btn" id="btnMenu">☰ メニュー</button>
</div>
<div id="menuPanel" class="hidden">
  <button class="hud-btn" id="btnSaveLog">ログ保存</button>
  <button class="hud-btn" id="btnToggleLog">ログを隠す</button>
  <button class="hud-btn" id="btnHelp">ヘルプ</button>
  <button class="hud-btn" id="btnLeave">退室する</button>
  <button class="hud-btn" id="btnLogout2">ログアウト</button>
</div>
<div id="helpCard" class="hidden">
  <h2>あそびかた</h2>
  <div id="helpText"></div>
  <button class="hud-btn" id="btnCloseHelp">とじる</button>
</div>
<div id="chatLog" class="hidden"></div>
<div id="chatBar" class="hidden">
  <input type="text" id="chatInput" placeholder="メッセージを入力" maxlength="200">
  <button id="chatSend">送信</button>
</div>
<div id="stick"><div id="stickKnob"></div></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------------- API ----------------
const TOKEN_KEY = 'starryapa_token';
let token = localStorage.getItem(TOKEN_KEY) || null;
let me = null; // {loginId, displayName, avatarType, avatarColor, isHost}

async function api(pathName, body) {
  const r = await fetch(pathName, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  return { status: r.status, data };
}
async function apiAuth(pathName, body) {
  const out = await api(pathName, Object.assign({ token }, body || {}));
  if (out.data && out.data.authFailed) { forceToAuth(); throw new Error('auth'); }
  return out;
}
function forceToAuth() {
  stopRoomLoops();
  token = null; me = null;
  localStorage.removeItem(TOKEN_KEY);
  show('authScreen');
}

// ---------------- 画面切替 ----------------
const SCREENS = ['authScreen', 'lobbyScreen'];
function show(id) {
  for (const s of SCREENS) document.getElementById(s).classList.toggle('hidden', s !== id);
  const inRoomUi = !id;
  document.getElementById('room').classList.toggle('hidden', !inRoomUi);
}
function showLobby() {
  show('lobbyScreen');
  document.getElementById('lobbyInfo').textContent =
    'ログイン中：' + me.displayName + '（' + ({ vera: 'ベラ', girl: '女の子', boy: '男の子' })[me.avatarType] + '）' + (me.isHost ? ' 店主' : '');
}

// ---------------- 認証UI ----------------
let regType = 'vera', regColor = 'violet';
const $ = id => document.getElementById(id);
$('tabLogin').onclick = () => {
  $('tabLogin').classList.add('active'); $('tabRegister').classList.remove('active');
  $('loginForm').classList.remove('hidden'); $('registerForm').classList.add('hidden');
};
$('tabRegister').onclick = () => {
  $('tabRegister').classList.add('active'); $('tabLogin').classList.remove('active');
  $('registerForm').classList.remove('hidden'); $('loginForm').classList.add('hidden');
};
$('avatarChoices').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  regType = b.dataset.type;
  for (const x of $('avatarChoices').children) x.classList.toggle('active', x === b);
});
$('colorChoices').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  regColor = b.dataset.color;
  for (const x of $('colorChoices').children) x.classList.toggle('active', x === b);
});
$('doLogin').onclick = async () => {
  $('loginError').textContent = '';
  const { status, data } = await api('/api/login', { loginId: $('loginId').value, password: $('loginPw').value });
  if (status !== 200) { $('loginError').textContent = data.error || 'ログインできませんでした'; return; }
  token = data.token; me = data.account;
  localStorage.setItem(TOKEN_KEY, token);
  showLobby();
};
$('doRegister').onclick = async () => {
  $('regError').textContent = '';
  const { status, data } = await api('/api/register', {
    loginId: $('regId').value, password: $('regPw').value,
    displayName: $('regName').value, avatarType: regType, avatarColor: regColor
  });
  if (status !== 200) { $('regError').textContent = data.error || '登録できませんでした'; return; }
  token = data.token; me = data.account;
  localStorage.setItem(TOKEN_KEY, token);
  showLobby();
};
async function doLogout() {
  try { await api('/api/logout', { token }); } catch (e) {}
  forceToAuth();
}
$('doLogout').onclick = doLogout;

// ---------------- 3D ----------------
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');
let renderer, scene, camera, clock;
let roomReady = false, inRoom = false;
const dollScenes = {}; // type -> THREE.Object3D (original)
const COLOR_HEX = { red: 0xc23b47, blue: 0x4070cc, green: 0x4da653, yellow: 0xe6bf3f };
const RECOLOR_MAT = { vera: 'violet', girl: 'violet', boy: 'shirt' };
const DOLL_URL = { vera: 'assets/vera_doll.glb', girl: 'assets/girl_guest.glb', boy: 'assets/boy_doll.glb' };

function showError(msg) {
  let box = $('errBox');
  if (!box) {
    box = document.createElement('div'); box.id = 'errBox';
    box.innerHTML = '<div><div id="errMsg"></div><br><button class="hud-btn" onclick="location.reload()">開き直す</button></div>';
    document.body.appendChild(box);
  }
  $('errMsg').textContent = msg;
}

async function initRoom() {
  if (roomReady) return;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: !isTouch, powerPreference: 'high-performance' });
  } catch (e) {
    showError('3D表示（WebGL）が使えませんでした。ブラウザを変えて開いてみてください。');
    throw e;
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 1.75));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = false;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  $('room').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1214);
  camera = new THREE.PerspectiveCamera(66, innerWidth / innerHeight, 0.05, 100);
  camera.rotation.order = 'YXZ';
  clock = new THREE.Clock();

  scene.add(new THREE.HemisphereLight(0xfff2e0, 0x40342a, 0.9));
  scene.add(new THREE.AmbientLight(0xffe8c8, 0.4));
  const pts = [
    [-1.6, 2.3, -2.6], [3.0, 2.4, -0.6], [0.2, 2.3, 2.4], [-3.0, 2.2, 0.8]
  ];
  for (const p of pts) {
    const L = new THREE.PointLight(0xffd9a0, 14, 9, 2);
    L.position.set(p[0], p[1], p[2]);
    scene.add(L);
  }

  const manager = new THREE.LoadingManager();
  const loader = new GLTFLoader(manager);
  const load = url => new Promise((res, rej) => loader.load(url, res, undefined, rej));
  const jobs = [
    ['room', 'assets/starryapa_room.glb'],
    ['vera', DOLL_URL.vera], ['girl', DOLL_URL.girl], ['boy', DOLL_URL.boy]
  ];
  let done = 0;
  for (const [key, url] of jobs) {
    const gltf = await load(url);
    if (key === 'room') {
      gltf.scene.traverse(o => { if (o.isMesh) { o.frustumCulled = true; } });
      scene.add(gltf.scene);
    } else {
      dollScenes[key] = gltf.scene;
    }
    done++;
    $('loadPct').textContent = Math.round(done / jobs.length * 100) + '%';
  }
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  roomReady = true;
}

// ---------------- アバター ----------------
function makeNameSprite(name, isHost) {
  const c = document.createElement('canvas'); c.width = 384; c.height = 112;
  const g = c.getContext('2d');
  g.font = 'bold 46px sans-serif';
  g.textBaseline = 'middle';
  const nameW = g.measureText(name).width;
  const tagW = isHost ? g.measureText('店主').width * 0.72 + 26 : 0;
  let x = (384 - nameW - tagW) / 2;
  if (isHost) {
    const tw = g.measureText('店主').width * 0.72 + 22;
    g.fillStyle = '#d9a83f';
    g.beginPath(); g.roundRect(x, 30, tw, 52, 10); g.fill();
    g.fillStyle = '#2a1a05'; g.font = 'bold 33px sans-serif';
    g.fillText('店主', x + 11, 58);
    g.font = 'bold 46px sans-serif';
    x += tw + 8;
  }
  g.lineWidth = 8; g.strokeStyle = 'rgba(20,10,12,0.85)';
  g.strokeText(name, x, 58);
  g.fillStyle = '#fff';
  g.fillText(name, x, 58);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(1.3, 0.38, 1);
  sp.position.y = 1.26;
  sp.renderOrder = 900;
  return sp;
}

function makeBubbleSprite(text) {
  const font = '34px sans-serif';
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = font;
  const maxW = 300;
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (meas.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
    else line += ch;
    if (lines.length === 3) break;
  }
  if (line && lines.length < 3) lines.push(line);
  const w = Math.max(...lines.map(l => meas.measureText(l).width)) + 36;
  const h = lines.length * 44 + 30;
  const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h) + 14;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.95)';
  g.beginPath(); g.roundRect(1, 1, w - 2, h - 2, 16); g.fill();
  g.beginPath();
  g.moveTo(w / 2 - 10, h - 2); g.lineTo(w / 2 + 10, h - 2); g.lineTo(w / 2, h + 12); g.closePath(); g.fill();
  g.font = font; g.fillStyle = '#262022'; g.textBaseline = 'top';
  lines.forEach((l, i) => g.fillText(l, 18, 13 + i * 44));
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  const worldW = Math.max(0.55, w / 300);
  sp.scale.set(worldW, worldW * c.height / c.width, 1);
  sp.position.y = 1.46 + (worldW * c.height / c.width) / 2;
  sp.renderOrder = 910;
  return sp;
}

function createAvatar(p) {
  const src = dollScenes[p.avatarType] || dollScenes.vera;
  const inner = src.clone(true);
  const target = RECOLOR_MAT[p.avatarType] || 'violet';
  if (p.avatarColor !== 'violet' && COLOR_HEX[p.avatarColor]) {
    const apply = m => {
      if (m && m.name === target) { const nm = m.clone(); nm.color.setHex(COLOR_HEX[p.avatarColor]); return nm; }
      return m;
    };
    inner.traverse(o => {
      if (!o.isMesh || !o.material) return;
      o.material = Array.isArray(o.material) ? o.material.map(apply) : apply(o.material);
    });
  }
  const box = new THREE.Box3().setFromObject(inner);
  const h = box.max.y - box.min.y;
  const s = 1.0 / h;
  inner.scale.setScalar(s);
  inner.position.y = -box.min.y * s;
  const group = new THREE.Group();
  group.add(inner);
  group.add(makeNameSprite(p.name, p.isHost));
  scene.add(group);
  return { group, bubble: null, bubbleUntil: 0, playerName: p.name, cur: { x: p.x, z: p.z, yaw: p.yaw }, tgt: { x: p.x, z: p.z, yaw: p.yaw } };
}

// ---------------- ピンポン ----------------
let audioCtx = null;
function chime() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    [[659.25, 0, 0.35], [523.25, 0.18, 0.55]].forEach(([f, dt, dur]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + dur + 0.05);
    });
  } catch (e) {}
}

// ---------------- 自分の移動 ----------------
const START = { x: -3.2, z: 0.6 };
const pos = { x: START.x, z: START.z };
let yaw = 0, pitch = 0;
function lookAtStart() {
  const dx = -1.55 - pos.x, dz = -2.95 - pos.z;
  yaw = Math.atan2(-dx, -dz);
  pitch = Math.atan2(1.2 - 1.5, Math.hypot(dx, dz));
}
lookAtStart();

const BOXES = [ // [minX, maxX, minZ, maxZ] three.js座標
  [-2.6, -0.5, -3.45, -2.2],   // アルコーブのデイベッド
  [3.1, 3.95, -3.45, 1.0],     // キッチンカウンター
  [-4.2, -1.2, 1.05, 1.25],    // 間仕切り
  [-1.0, 1.2, 2.45, 3.35],     // ソファ
  [-0.3, 0.6, 1.7, 2.3],       // コーヒーテーブル
  [1.6, 2.3, 1.85, 2.55]       // アームチェア
];
function collide(nx, nz) {
  nx = Math.max(-3.9, Math.min(3.9, nx));
  nz = Math.max(-3.45, Math.min(3.3, nz));
  const r = 0.3;
  for (const [x0, x1, z0, z1] of BOXES) {
    const cx = Math.max(x0, Math.min(x1, nx));
    const cz = Math.max(z0, Math.min(z1, nz));
    const dx = nx - cx, dz = nz - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < r * r) {
      if (d2 === 0) { nz = z0 - r; continue; }
      const d = Math.sqrt(d2);
      nx = cx + dx / d * r; nz = cz + dz / d * r;
    }
  }
  return [nx, nz];
}

const keys = {};
let chatFocused = false;
addEventListener('keydown', e => {
  if (chatFocused) return;
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

// マウス視点 (ポインターロック / ドラッグ)
let locked = false, dragging = false, lastPX = 0, lastPY = 0;
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement && renderer && document.pointerLockElement === renderer.domElement;
});
document.addEventListener('mousemove', e => {
  if (!inRoom) return;
  if (locked) {
    yaw -= e.movementX * 0.0023;
    pitch -= e.movementY * 0.0023;
    pitch = Math.max(-1.1, Math.min(1.1, pitch));
  } else if (dragging) {
    yaw -= (e.clientX - lastPX) * 0.005;
    pitch -= (e.clientY - lastPY) * 0.005;
    pitch = Math.max(-1.1, Math.min(1.1, pitch));
    lastPX = e.clientX; lastPY = e.clientY;
  }
});

// ジョイスティック
const stickVec = { x: 0, y: 0 };
let stickId = null;
function setupTouchControls() {
  const stick = $('stick'), knob = $('stickKnob');
  const cv = renderer.domElement;
  cv.addEventListener('pointerdown', e => {
    if (!inRoom || isTouch) return;
    if (document.activeElement === $('chatInput')) return;
    if (!locked) {
      try { cv.requestPointerLock(); } catch (err) { dragging = true; lastPX = e.clientX; lastPY = e.clientY; }
    }
  });
  addEventListener('pointerup', () => { dragging = false; });
  // タッチ視点ドラッグ (スティック以外)
  let lookId = null, lx = 0, ly = 0;
  cv.addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      if (lookId === null) { lookId = t.identifier; lx = t.clientX; ly = t.clientY; }
    }
  }, { passive: true });
  cv.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookId) {
        yaw -= (t.clientX - lx) * 0.006;
        pitch -= (t.clientY - ly) * 0.006;
        pitch = Math.max(-1.1, Math.min(1.1, pitch));
        lx = t.clientX; ly = t.clientY;
      }
    }
  }, { passive: true });
  cv.addEventListener('touchend', e => {
    for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null;
  });
  stick.addEventListener('touchstart', e => {
    const t = e.changedTouches[0]; stickId = t.identifier; e.preventDefault();
  }, { passive: false });
  addEventListener('touchmove', e => {
    if (stickId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== stickId) continue;
      const r = stick.getBoundingClientRect();
      let dx = t.clientX - (r.left + r.width / 2);
      let dy = t.clientY - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy), max = 36;
      if (d > max) { dx = dx / d * max; dy = dy / d * max; }
      stickVec.x = dx / max; stickVec.y = dy / max;
      knob.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px))';
    }
  }, { passive: true });
  addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        stickId = null; stickVec.x = 0; stickVec.y = 0;
        knob.style.transform = 'translate(-50%, -50%)';
      }
    }
  });
}

// ---------------- 同期 ----------------
const remotes = new Map();
let knownIds = null;
let hbTimer = null, plTimer = null, msgTimer = null, rafId = null;
let lastMsgId = 0;
const sessionLog = [];

async function pollPlayers() {
  const { data } = await apiAuth('/api/players', {});
  const list = data.players || [];
  $('count').textContent = 'いま' + (list.length + 1) + '人';
  const seen = new Set();
  let joined = false;
  for (const p of list) {
    seen.add(p.id);
    if (knownIds && !knownIds.has(p.id)) joined = true;
    const r = remotes.get(p.id);
    if (r) { r.tgt.x = p.x; r.tgt.z = p.z; r.tgt.yaw = p.yaw; }
    else remotes.set(p.id, createAvatar(p));
  }
  for (const [id, r] of remotes) {
    if (!seen.has(id)) { scene.remove(r.group); remotes.delete(id); }
  }
  if (joined) chime();
  knownIds = seen;
}

async function pollMessages() {
  const { data } = await apiAuth('/api/messages', { sinceId: lastMsgId });
  for (const m of data.messages || []) {
    lastMsgId = Math.max(lastMsgId, m.id);
    sessionLog.push(m);
    appendChat(m);
    if (me && m.name !== me.displayName) showBubbleFor(m);
  }
}
function appendChat(m) {
  const log = $('chatLog');
  const div = document.createElement('div');
  const who = document.createElement('span'); who.className = 'who'; who.textContent = m.name + '：';
  div.appendChild(who);
  div.appendChild(document.createTextNode(m.text));
  log.appendChild(div);
  while (log.children.length > 20) log.removeChild(log.firstChild);
  log.scrollTop = log.scrollHeight;
}
function showBubbleFor(m) {
  for (const r of remotes.values()) {
    if (r.playerName === m.name) { setBubble(r, m.text); return; }
  }
}
function setBubble(r, text) {
  if (r.bubble) { r.group.remove(r.bubble); r.bubble.material.map.dispose(); r.bubble.material.dispose(); }
  r.bubble = makeBubbleSprite(text);
  r.group.add(r.bubble);
  r.bubbleUntil = performance.now() + 4000;
}

function renderLoop() {
  rafId = requestAnimationFrame(renderLoop);
  const dt = Math.min(clock.getDelta(), 0.05);
  // 移動
  let mx = 0, mz = 0;
  const fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - stickVec.y;
  const str = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + stickVec.x;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  mx = (-sin * fwd + cos * str);
  mz = (-cos * fwd - sin * str);
  const len = Math.hypot(mx, mz);
  if (len > 0.01) {
    const sp = 2.3 * dt / Math.max(1, len);
    const [nx, nz] = collide(pos.x + mx * sp, pos.z + mz * sp);
    pos.x = nx; pos.z = nz;
  }
  camera.position.set(pos.x, 1.5, pos.z);
  camera.rotation.set(pitch, yaw, 0);
  // リモート補間
  const now = performance.now();
  for (const r of remotes.values()) {
    r.cur.x += (r.tgt.x - r.cur.x) * 0.18;
    r.cur.z += (r.tgt.z - r.cur.z) * 0.18;
    let dy = r.tgt.yaw - r.cur.yaw;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    r.cur.yaw += dy * 0.18;
    r.group.position.set(r.cur.x, 0, r.cur.z);
    r.group.rotation.y = r.cur.yaw + Math.PI;
    if (r.bubble && now > r.bubbleUntil) {
      r.group.remove(r.bubble); r.bubble = null;
    }
  }
  renderer.render(scene, camera);
}

function startRoomLoops() {
  hbTimer = setInterval(() => { apiAuth('/api/heartbeat', { x: pos.x, z: pos.z, yaw }).catch(() => {}); }, 250);
  plTimer = setInterval(() => { pollPlayers().catch(() => {}); }, 300);
  msgTimer = setInterval(() => { pollMessages().catch(() => {}); }, 600);
  pollPlayers().catch(() => {});
  pollMessages().catch(() => {});
  rafId = requestAnimationFrame(renderLoop);
}
function stopRoomLoops() {
  inRoom = false;
  clearInterval(hbTimer); clearInterval(plTimer); clearInterval(msgTimer);
  if (rafId) cancelAnimationFrame(rafId);
  hbTimer = plTimer = msgTimer = rafId = null;
}

// ---------------- 入室 / 退室 ----------------
$('doEnter').onclick = async () => {
  chimeResumeOnly();
  show(null);
  $('loading').classList.remove('hidden');
  try {
    await initRoom();
  } catch (e) {
    $('loading').classList.add('hidden');
    showLobby();
    return;
  }
  $('loading').classList.add('hidden');
  pos.x = START.x; pos.z = START.z; lookAtStart();
  inRoom = true;
  knownIds = null;
  for (const el of ['room', 'count', 'topRight', 'chatLog', 'chatBar']) $(el).classList.remove('hidden');
  setupTouchControlsOnce();
  $('helpText').innerHTML = isTouch
    ? '左下のスティックで移動、画面をドラッグで見回します。<br>下の入力欄からチャットできます。'
    : 'クリックでマウス操作（WASDで移動）、Escで解除。<br>ドラッグでも見回せます。下の入力欄からチャットできます。';
  $('helpCard').classList.remove('hidden');
  startRoomLoops();
};
function chimeResumeOnly() {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}
let touchSetupDone = false;
function setupTouchControlsOnce() { if (!touchSetupDone) { setupTouchControls(); touchSetupDone = true; } }

async function leaveRoom() {
  stopRoomLoops();
  try { await apiAuth('/api/leave', {}); } catch (e) {}
  for (const el of ['room', 'count', 'topRight', 'chatLog', 'chatBar', 'menuPanel', 'helpCard']) $(el).classList.add('hidden');
  for (const [, r] of remotes) scene.remove(r.group);
  remotes.clear();
  showLobby();
}
$('btnLeave').onclick = leaveRoom;
$('btnLogout2').onclick = async () => { await leaveRoom(); await doLogout(); };
$('btnReset').onclick = () => { pos.x = START.x; pos.z = START.z; lookAtStart(); };
$('btnMenu').onclick = () => $('menuPanel').classList.toggle('hidden');
$('btnHelp').onclick = () => { $('helpCard').classList.remove('hidden'); $('menuPanel').classList.add('hidden'); };
$('btnCloseHelp').onclick = () => $('helpCard').classList.add('hidden');
let logVisible = true;
$('btnToggleLog').onclick = () => {
  logVisible = !logVisible;
  $('chatLog').classList.toggle('hidden', !logVisible);
  $('btnToggleLog').textContent = logVisible ? 'ログを隠す' : 'ログを表示';
  $('menuPanel').classList.add('hidden');
};
$('btnSaveLog').onclick = () => {
  $('menuPanel').classList.add('hidden');
  if (!sessionLog.length) return;
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  const head = 'StarryApa チャットログ (' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ')';
  const lines = sessionLog.map(m => {
    const t = new Date(m.ts);
    return pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds()) + ' ' + m.name + '：' + m.text;
  });
  const blob = new Blob([[head, ...lines].join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'starryapa_chat_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
};

// ---------------- チャット ----------------
$('chatInput').addEventListener('focus', () => { chatFocused = true; });
$('chatInput').addEventListener('blur', () => { chatFocused = false; });
async function sendChat() {
  const inp = $('chatInput');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  try { await apiAuth('/api/say', { text }); } catch (e) {}
  inp.blur();
}
$('chatSend').onclick = sendChat;
$('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

// ページを閉じる時に退室
addEventListener('pagehide', () => {
  if (token && inRoom) {
    try { navigator.sendBeacon('/api/leave', JSON.stringify({ token })); } catch (e) {}
  }
});

// ---------------- 起動 ----------------
(async () => {
  if (token) {
    const { data } = await api('/api/me', { token });
    if (data.account) { me = data.account; showLobby(); return; }
    token = null; localStorage.removeItem(TOKEN_KEY);
  }
  show('authScreen');
})();


</script>
