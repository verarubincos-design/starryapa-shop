<style>

  /* ---------- ログイン / 登録 / ロビー ---------- */

  .card { background: rgba(43, 26, 30, 0.95); border: 1px solid #7a4a52; border-radius: 16px; padding: 24px 22px; width: 100%; max-width: 380px; box-shadow: 0 12px 40px rgba(0,0,0,0.5); }

  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------------- API ----------------
const TOKEN_KEY = 'starryapa_token';
const VIEW_KEY = 'starryapa_view';
let token = localStorage.getItem(TOKEN_KEY) || null;
let thirdPerson = localStorage.getItem(VIEW_KEY) === 'third'; // v3.4.3: 三人称視点 (既定は一人称)
let me = null; // {loginId, displayName, avatarType, avatarColor, isHost}

async function api(pathName, body) {
  const r = await fetch(pathName, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  return { status: r.status, data };
}
async function apiAuth(pathName, body) {
  const out = await api(pathName, Object.assign({ token }, body || {}));
  if (out.data && out.data.authFailed) { forceToAuth(); throw new Error('auth'); }
  return out;
}
function forceToAuth() {
  stopRoomLoops();
  token = null; me = null;
  localStorage.removeItem(TOKEN_KEY);
  show('authScreen');
}

// ---------------- 画面切替 ----------------
const SCREENS = ['authScreen', 'lobbyScreen'];
function show(id) {
  for (const s of SCREENS) document.getElementById(s).classList.toggle('hidden', s !== id);
  const inRoomUi = !id;
  document.getElementById('room').classList.toggle('hidden', !inRoomUi);
}
function showLobby() {
  show('lobbyScreen');
  document.getElementById('lobbyInfo').textContent =
    'ログイン中：' + me.displayName + '（' + ({ vera: 'ベラ', girl: '女の子', boy: '男の子' })[me.avatarType] + '）' + (me.isHost ? ' 店主' : '');
}

// ---------------- 認証UI ----------------
let regType = 'girl', regColor = 'violet';   // v4.1: ベラ人形は店主専用なので初期選択は女の子
const $ = id => document.getElementById(id);
$('tabLogin').onclick = () => {
  $('tabLogin').classList.add('active'); $('tabRegister').classList.remove('active');
  $('loginForm').classList.remove('hidden'); $('registerForm').classList.add('hidden');
};
$('tabRegister').onclick = () => {
  $('tabRegister').classList.add('active'); $('tabLogin').classList.remove('active');
  $('registerForm').classList.remove('hidden'); $('loginForm').classList.add('hidden');
};
$('avatarChoices').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  regType = b.dataset.type;
  for (const x of $('avatarChoices').children) x.classList.toggle('active', x === b);
});
$('colorChoices').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  regColor = b.dataset.color;
  for (const x of $('colorChoices').children) x.classList.toggle('active', x === b);
});
$('doLogin').onclick = async () => {
  $('loginError').textContent = '';
  const { status, data } = await api('/api/login', { loginId: $('loginId').value, password: $('loginPw').value });
  if (status !== 200) { $('loginError').textContent = data.error || 'ログインできませんでした'; return; }
  token = data.token; me = data.account;
  localStorage.setItem(TOKEN_KEY, token);
  showLobby();
};
$('doRegister').onclick = async () => {
  $('regError').textContent = '';
  const { status, data } = await api('/api/register', {
    loginId: $('regId').value, password: $('regPw').value,
    displayName: $('regName').value, avatarType: regType, avatarColor: regColor
  });
  if (status !== 200) { $('regError').textContent = data.error || '登録できませんでした'; return; }
  token = data.token; me = data.account;
  localStorage.setItem(TOKEN_KEY, token);
  showLobby();
};
async function doLogout() {
  try { await api('/api/logout', { token }); } catch (e) {}
  forceToAuth();
}
$('doLogout').onclick = doLogout;

// ---------------- 3D ----------------
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');
let renderer, scene, camera, clock;
let roomReady = false, inRoom = false;
const dollScenes = {}; // type -> THREE.Object3D (original)
let fish = null, fishBase = null, fishC = null, fishRotY = 0;   // v4.1: Bar AQUA の水槽の魚
let koiP = null;   // v5.3: はに茶屋の池の鯉 (池の中心で回して泳がせる)
// v4.5: プレイランドの動く乗り物
let playWheelP = null, playCarP = null, playVikP = null;
let playWheelMesh = null, playCarMesh = null, playVikMesh = null;
const playGondolas = [];   // {mesh, c (焼き込み中心), phi}
const PLAY_HUB = { x: -34.8, y: 5.0, z: -28.6 };   // 観覧車の軸 (three座標)
const PLAY_WR = 3.4, PLAY_GK = 0.49;               // 輪の半径 / ゴンドラ中心の垂れ下がり
function pivotize(mesh, cx, cy, cz) {
  if (!mesh || !mesh.parent) return null;
  const pivot = new THREE.Group();
  pivot.position.set(cx, cy, cz);
  mesh.parent.add(pivot);
  pivot.attach(mesh);   // メッシュのワールド姿勢を保ったままピボット配下へ (結合メッシュの変換が残っていても安全)

const BAL_CYCLE = BAL_RISE + BAL_HOLD + BAL_FALL;                  // 44秒で一周
const BAL_SPIN = 0.12;         // v4.9: 飛行中のゆっくりした回転 (rad/s)
function balloonH(t) {         // 経過秒 → 高さ (出発と着陸はなめらかに)
  if (!(t > 0) || t >= BAL_CYCLE) return 0;
  const ease = u => 0.5 - 0.5 * Math.cos(Math.PI * u);
  if (t < BAL_RISE) return BAL_TOP * ease(t / BAL_RISE);
  if (t < BAL_RISE + BAL_HOLD) return BAL_TOP;
  return BAL_TOP * (1 - ease((t - BAL_RISE - BAL_HOLD) / BAL_FALL));
}

function makeNameSprite(name, isHost) {
  const c = document.createElement('canvas'); c.width = 384; c.height = 112;
  const g = c.getContext('2d');
  g.font = 'bold 46px sans-serif';
  g.textBaseline = 'middle';
  const nameW = g.measureText(name).width;
  const tagW = isHost ? g.measureText('店主').width * 0.72 + 26 : 0;
  let x = (384 - nameW - tagW) / 2;
  if (isHost) {
    const tw = g.measureText('店主').width * 0.72 + 22;
    g.fillStyle = '#d9a83f';
    g.beginPath(); g.roundRect(x, 30, tw, 52, 10); g.fill();
    g.fillStyle = '#2a1a05'; g.font = 'bold 33px sans-serif';
    g.fillText('店主', x + 11, 58);
    g.font = 'bold 46px sans-serif';
    x += tw + 8;
  }
  g.lineWidth = 8; g.strokeStyle = 'rgba(20,10,12,0.85)';
  g.strokeText(name, x, 58);
  g.fillStyle = '#fff';
  g.fillText(name, x, 58);
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(1.3, 0.38, 1);
  sp.position.y = 1.26;
  sp.renderOrder = 900;
  return sp;
}

function makeBubbleSprite(text) {
  const font = '34px sans-serif';
  const meas = document.createElement('canvas').getContext('2d');
  meas.font = font;
  const maxW = 300;
  const lines = [];
  let line = '';
  for (const ch of text) {
    if (meas.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
    else line += ch;
    if (lines.length === 3) break;
  }
  if (line && lines.length < 3) lines.push(line);
  const w = Math.max(...lines.map(l => meas.measureText(l).width)) + 36;
  const h = lines.length * 44 + 30;
  const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h) + 14;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(255,255,255,0.95)';
  g.beginPath(); g.roundRect(1, 1, w - 2, h - 2, 16); g.fill();
  g.beginPath();
  g.moveTo(w / 2 - 10, h - 2); g.lineTo(w / 2 + 10, h - 2); g.lineTo(w / 2, h + 12); g.closePath(); g.fill();
  g.font = font; g.fillStyle = '#262022'; g.textBaseline = 'top';
  lines.forEach((l, i) => g.fillText(l, 18, 13 + i * 44));
  const tex = new THREE.CanvasTexture(c);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  const worldW = Math.max(0.55, w / 300);
  sp.scale.set(worldW, worldW * c.height / c.width, 1);
  sp.position.y = 1.46 + (worldW * c.height / c.width) / 2;
  sp.renderOrder = 910;
  return sp;
}

// 手をあげる用: 肩を支点に回す腕パーツ (GLB内の実ノード名・モデル座標)
// vera は arm ノードが無く sleeve+hand のみ。座標は各モデルの肩位置 (モデル単位)
const ARM_SPEC = {
  vera: { parts: ['sleeve1', 'hand1'], pivot: [0.26, 1.16, 0.0] },
  girl: { parts: ['sleeve1', 'arm1', 'hand1'], pivot: [0.25, 1.11, 0.0] },
  boy: { parts: ['sleeve1', 'arm1', 'hand1'], pivot: [0.25, 1.11, 0.0] }
};
function findArmParts(inner, type) {
  const spec = ARM_SPEC[type] || ARM_SPEC.vera;
  const parts = [];
  for (const name of spec.parts) {
    const node = inner.getObjectByName(name);
    if (!node) return []; // 揃わなければフォールバック (体の小さな揺れ) に回す
    parts.push({ node, pos0: node.position.clone(), quat0: node.quaternion.clone() });
  }
  return { parts, pivot: new THREE.Vector3(spec.pivot[0], spec.pivot[1], spec.pivot[2]) };
}
// 左腕用 (よろこぶで両手を上げる)。ノード名は右の "…1" に対して "…-1"、支点は x 反転
function findArmPartsL(inner, type) {
  const spec = ARM_SPEC[type] || ARM_SPEC.vera;
  const parts = [];
  for (const name of spec.parts) {
    const node = inner.getObjectByName(name.replace(/1$/, '-1'));
    if (!node) return { parts: [], pivot: null }; // 揃わなければその腕は動かさない
    parts.push({ node, pos0: node.position.clone(), quat0: node.quaternion.clone() });
  }
  return { parts, pivot: new THREE.Vector3(-spec.pivot[0], spec.pivot[1], spec.pivot[2]) };
}

// v3.4.1: 人形GLBに紛れ込んだ「地面プレーン」を読み込み時に取り除く。
// vera_doll.glb には Blender 作業シーンの床 (30m×30m の Plane, 材質名 floor) が
// 一緒に書き出されていて、そのままクローンするとアバターが部屋いっぱいの
// 床シートを足元に抱え、エモートで床ごと動いて見えた。
// 「横・奥行きが 5m 超で厚みほぼゼロ」の直下ノードだけを地面とみなして除去する
// (人形の台座シリンダー等は 1.9m 幅なので残る)。
function stripGroundPlanes(root) {
  const kill = [];
  for (const child of root.children) {
    const b = new THREE.Box3().setFromObject(child);
    if (b.isEmpty()) continue;
    const sx = b.max.x - b.min.x, sy = b.max.y - b.min.y, sz = b.max.z - b.min.z;
    if (sx > 5 && sz > 5 && sy < 0.1) kill.push(child);
  }
  for (const c of kill) root.remove(c);
}

function createAvatar(p, isSelf = false) {
  const src = dollScenes[p.avatarType] || dollScenes.vera;
  const inner = src.clone(true);
  const target = RECOLOR_MAT[p.avatarType] || 'violet';
  if (p.avatarColor !== 'violet' && COLOR_HEX[p.avatarColor]) {
    const apply = m => {
      if (m && m.name === target) { const nm = m.clone(); nm.color.setHex(COLOR_HEX[p.avatarColor]); return nm; }
      return m;
    };
    inner.traverse(o => {
      if (!o.isMesh || !o.material) return;
      o.material = Array.isArray(o.material) ? o.material.map(apply) : apply(o.material);
    });
  }
  const box = new THREE.Box3().setFromObject(inner);
  const h = box.max.y - box.min.y;
  const s = 1.0 / h;
  inner.scale.setScalar(s);
  inner.position.y = -box.min.y * s;
  const group = new THREE.Group();
  group.add(inner);
  if (!isSelf) group.add(makeNameSprite(p.name, p.isHost)); // 自分のアバターには名前札・吹き出しを付けない
  scene.add(group);
  const arm = findArmParts(inner, p.avatarType);
  const armL = findArmPartsL(inner, p.avatarType);
  return {
    group, inner, bubble: null, bubbleUntil: 0, playerName: p.name,
    cur: { x: p.x, z: p.z, yaw: p.yaw }, tgt: { x: p.x, z: p.z, yaw: p.yaw },
    armParts: arm.parts || [], armPivot: arm.pivot || null,
    armPartsL: armL.parts || [], armPivotL: armL.pivot || null,
    emote: null, lastEmoteAt: p.emoteAt || 0
  };
}

let audioCtx = null;
function chime() {
  // v3.4: 音量アップ + ピンポンを2回繰り返し、他の音に埋もれにくくした (2回目は少し小さく)
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const strikes = [
      [659.25, 0.00, 0.50], [523.25, 0.22, 0.50],
      [659.25, 0.58, 0.38], [523.25, 0.80, 0.38]
    ];
    for (const [f, dt, peak] of strikes) {
      const dur = 0.9;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(peak, t0 + dt + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + dur);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + dur + 0.05);
      // 明るさを出すための倍音 (小さく)
      const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
      o2.type = 'sine'; o2.frequency.value = f * 2;
      g2.gain.setValueAtTime(0.0001, t0 + dt);
      g2.gain.exponentialRampToValueAtTime(peak * 0.18, t0 + dt + 0.01);
      g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.4);
      o2.connect(g2).connect(audioCtx.destination);
      o2.start(t0 + dt); o2.stop(t0 + dt + 0.45);
    }
  } catch (e) {}
}

  if (x >= -15.23 && x <= -9.87 && z >= 33.32 && z <= 37.68) return 0.06;  // レイナ亭

}

const stickVec = { x: 0, y: 0 };

  cv.addEventListener('pointerdown', e => {

    }
  }, { passive: true });
  cv.addEventListener('touchmove', e => {
    for (const t of e.changedTouches) {

      }
    }
  }, { passive: true });

    for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null;
  });

    const t = e.changedTouches[0]; stickId = t.identifier; e.preventDefault();
  }, { passive: false });
  addEventListener('touchmove', e => {
    if (stickId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier !== stickId) continue;
      const r = stick.getBoundingClientRect();
      let dx = t.clientX - (r.left + r.width / 2);
      let dy = t.clientY - (r.top + r.height / 2);
      const d = Math.hypot(dx, dy), max = 36;
      if (d > max) { dx = dx / d * max; dy = dy / d * max; }
      stickVec.x = dx / max; stickVec.y = dy / max;

    for (const t of e.changedTouches) {

}

async function pollPlayers() {
  const { data } = await apiAuth('/api/players', {});
  const list = data.players || [];
  $('count').textContent = 'いま' + (list.length + 1) + '人';
  const seen = new Set();
  const firstPoll = knownIds === null;
  let joined = false;
  for (const p of list) {
    seen.add(p.id);
    // ドアベルは「新しい入室 (joinedAt が新しい)」の時だけ鳴らす。
    // 一時的に見えなくなって戻ってきただけ (同じ joinedAt) では鳴らさない
    if (welcomed.get(p.id) !== p.joinedAt) {
      welcomed.set(p.id, p.joinedAt);
      if (!firstPoll) joined = true;
    }
    const r = remotes.get(p.id);
    if (r) {
      r.tgt.x = p.x; r.tgt.z = p.z; r.tgt.yaw = p.yaw; r.ry = p.ry || 0;
      if (p.emote && p.emoteAt && p.emoteAt !== r.lastEmoteAt) {

        r.emote = { name: p.emote, t0: performance.now() };
      }
    }
    else remotes.set(p.id, createAvatar(p));
  }
  for (const [id, r] of remotes) {
    if (!seen.has(id)) { scene.remove(r.group); remotes.delete(id); }
  }
  if (joined) chime();
  knownIds = seen;
  // v4.3: 誰かが花火を発射したら全員に同じ花火が上がる (最初の取得では鳴らさない)
  if (data.fireworksAt) {
    if (lastFwAt === null) lastFwAt = data.fireworksAt;
    else if (data.fireworksAt !== lastFwAt) { lastFwAt = data.fireworksAt; startFwShow(); }
  }
  // v4.9: 気球の状態 (誰が乗っていつ飛び立ったか) を全員で共有する
  balloonAt = data.balloonAt || 0;
  balloonBy = data.balloonBy || '';
}

// v4.8: 流れ星。たまに (9〜31秒おき) 空を1つ、まれに2つ連なって流れる
function spawnMeteor(nowMs, delayMs) {
  const th = Math.random() * Math.PI * 2;                    // 水平の向きはランダム
  const vh = 24 + Math.random() * 10;                        // 水平の速さ
  const vel = { x: Math.cos(th) * vh, y: -vh * (0.34 + Math.random() * 0.18), z: Math.sin(th) * vh };
  const speed = Math.hypot(vel.x, vel.y, vel.z);
  const life = (46 + Math.random() * 14) / speed;            // 46〜60m 流れる
  // 街の中心 (-25, -5) の上空を横切るよう、進行方向の逆側から出す
  const back = 26 + Math.random() * 8;
  const px = -25 - vel.x / speed * back + (Math.random() - 0.5) * 14;
  const pz = -5 - vel.z / speed * back + (Math.random() - 0.5) * 14;
  const py = 35 + Math.random() * 9;
  const TRAIL = 16;
  const posArr = new Float32Array(TRAIL * 3), colArr = new Float32Array(TRAIL * 3);
  for (let i = 0; i < TRAIL; i++) {
    const f = Math.pow(1 - i / (TRAIL - 1), 1.6);            // 尾はだんだん暗く (加算合成で消える)
    colArr[i * 3] = 0.85 * f; colArr[i * 3 + 1] = 0.90 * f; colArr[i * 3 + 2] = f;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  g.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
  const line = new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  line.frustumCulled = false;
  if (!meteorTex) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const cx2 = cv.getContext('2d');
    const gr = cx2.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(210,225,255,0.55)');
    gr.addColorStop(1, 'rgba(180,200,255,0)');
    cx2.fillStyle = gr; cx2.fillRect(0, 0, 64, 64);
    meteorTex = new THREE.CanvasTexture(cv);
  }
  const head = new THREE.Sprite(new THREE.SpriteMaterial({ map: meteorTex, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  head.scale.set(2.4, 2.4, 1);
  scene.add(line); scene.add(head);

}
function updateMeteors(nowMs) {
  if (!nextMeteorAt) nextMeteorAt = nowMs + 5000 + Math.random() * 8000;   // 最初は5〜13秒後
  if (nowMs >= nextMeteorAt) {
    spawnMeteor(nowMs, 0);
    if (Math.random() < 0.18) spawnMeteor(nowMs, 350 + Math.random() * 400);   // たまに2つ目が続く
    nextMeteorAt = nowMs + 9000 + Math.random() * 22000;
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    const age = (nowMs - m.t0) / 1000;
    if (age < 0) continue;
    if (age >= m.life) {
      scene.remove(m.line); scene.remove(m.head);
      m.line.geometry.dispose(); m.line.material.dispose(); m.head.material.dispose();
      meteors.splice(i, 1);
      continue;
    }
    const hx = m.x0 + m.vel.x * age, hy = m.y0 + m.vel.y * age, hz = m.z0 + m.vel.z * age;
    for (let j = 0; j < m.trail; j++) {
      const bt = j * 0.030;   // 尾は頭の少し後ろをたどる
      m.posArr[j * 3] = hx - m.vel.x * bt;
      m.posArr[j * 3 + 1] = hy - m.vel.y * bt;
      m.posArr[j * 3 + 2] = hz - m.vel.z * bt;
    }

    m.line.material.opacity = env;
    m.head.material.opacity = env;
    m.head.position.set(hx, hy, hz);
  }
}

    const camMinX = inPlay ? -39.5 : (inCha ? -9.6 : (inMia ? -9.5 : (inPoku ? -9.0 : (inReina ? -14.9 : (inIkuo ? -38.3 : (inUme ? -38.0 : (onMtn ? -60.5 : (pos.x < -3.85 ? westMinX : -3.75))))))));

    // v3.8.1: z方向の限界も外では小道の端まで広げる (店内の値のままだと小道で真上視点になっていた)
    // v3.9: 公園の西端・芝生の端まで広げる
    const camMinZ = inPlay ? -31.5 : (inCha ? -14.7 : (inMia ? -26.6 : (inPoku ? 9.9 : (inReina ? 33.8 : (inIkuo ? 14.85 : (inUme ? 8.9 : (onMtn ? -13.8 : (pos.x < -3.85 ? -31.6 : -3.3))))))));
    const camMaxZ = inPlay ? -14.1 : (inCha ? -8.3 : (inMia ? -20.4 : (inPoku ? 13.1 : (inReina ? 37.3 : (inIkuo ? 19.55 : (inUme ? 12.9 : (onMtn ? 13.8 : (pos.x < -3.85 ? 39.6 : 3.15))))))));
    const myY = groundH(pos.x, pos.z) + rideY;  // v3.19: 自分の足元の高さ (山の上ではカメラも一緒に上がる)。v4.6: 乗車中はデッキ分も
    let tMax = D;
    if (fwdX > 0.0001) tMax = Math.min(tMax, (pos.x - camMinX) / fwdX);
    else if (fwdX < -0.0001) tMax = Math.min(tMax, (camMaxX - pos.x) / -fwdX);
    if (fwdZ > 0.0001) tMax = Math.min(tMax, (pos.z - camMinZ) / fwdZ);
    else if (fwdZ < -0.0001) tMax = Math.min(tMax, (camMaxZ - pos.z) / -fwdZ);
    let cx, cy, cz;
    if (tMax >= 0.3) {
      const camDist = Math.max(0.3, tMax);
      cx = pos.x - fwdX * camDist; cz = pos.z - fwdZ * camDist;
      cy = myY + 1.45 - pitch * 0.8;                       // pitch (見上げ/見下ろし) でカメラの高さが少し動く
    } else {
      // 背後に壁が近すぎる時は、ほぼ真上から見下ろす形にする (キャラが画面外に消えないように)
      const back = Math.max(0, tMax);
      cx = pos.x - fwdX * back; cz = pos.z - fwdZ * back;
      cy = myY + 2.1;
    }
    camera.position.set(cx, cy, cz);
    // キャラの少し上・少し前を見る
    camera.lookAt(pos.x + fwdX * 0.4, myY + 0.95 + pitch * 0.5, pos.z + fwdZ * 0.4);
  } else {
    // v3.4.2: 自分のエモートの視点フィードバック (v3.4 仕様。本人の希望で復活)。
    // 一人称では自分の人形が見えないため、エモートが発動したことを視点の動きで伝える:
    // ジャンプ = 視点が同じ弧で跳ねる / お辞儀 = 見下ろして戻る。手をあげるは視点効果なし。
    // 動かすのはカメラだけで、部屋や人形には触らない (床バグ対策 stripGroundPlanes は別途維持)
    let camY = 1.5 + groundH(pos.x, pos.z) + rideY, camPitch = pitch, camYaw = yaw;  // v3.19: 山の上では視点も上がる。v4.6: 乗車中はデッキ分も
    if (myEmote) {
      const t = (now - myEmote.t0) / 1000;
      if (myEmote.name === 'jump') {
        if (t >= 0.45) myEmote = null;
        else camY += 0.25 * Math.sin(Math.PI * t / 0.45); // 人形の跳ね (emoteFrame) と同じ弧
      } else if (myEmote.name === 'bow') {
        if (t >= 1.0) myEmote = null;
        else camPitch -= THREE.MathUtils.degToRad(20) * Math.sin(Math.PI * t / 1.0); // 見下ろし
      } else if (myEmote.name === 'joy') {
        if (t >= 1.6) myEmote = null;
        else camYaw = yaw + Math.PI * 2 * (t / 1.6); // 自分もその場で1周回る
      } else myEmote = null;
    }
    camera.position.set(pos.x, camY, pos.z);
    camera.rotation.set(camPitch, camYaw, 0);
  }
  // 自分のアバター: 三人称の時だけ表示し、自分の位置・向き・エモートをそのまま反映する。
  // 向きは リモートと同じ式 (yaw + π) — モデルの正面 (+Z) が視線方向を向くので、
  // 後ろに置いたカメラからは後ろ姿が見える
  if (selfAvatar) {
    selfAvatar.group.visible = thirdPerson;
    const sfx = emoteFrame(selfAvatar, now);
    selfAvatar.group.position.set(pos.x, groundH(pos.x, pos.z) + rideY + sfx.yOff, pos.z);
    selfAvatar.group.rotation.y = yaw + Math.PI;
    selfAvatar.inner.rotation.x = sfx.bowX;
    selfAvatar.inner.rotation.z = sfx.rockZ;
    selfAvatar.inner.rotation.y = sfx.spinY;
  }
  // リモート補間 + エモート
  for (const [rid, r] of remotes) {
    r.cur.x += (r.tgt.x - r.cur.x) * 0.18;
    r.cur.z += (r.tgt.z - r.cur.z) * 0.18;
    let dy = r.tgt.yaw - r.cur.yaw;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    r.cur.yaw += dy * 0.18;
    const fx = emoteFrame(r, now);
    let rY = r.ry || 0;
    // v5.0: 気球の搭乗者の高さは、中継されてくる ry ではなく気球本体と同じ balloonAt から計算する
    // (ry はハートビート＋ポーリング経由で遅れるため、見る側で気球とキャラがずれて見えた)
    if (balloonAt && balloonBy && rid === balloonBy) {
      const bt = (Date.now() - balloonAt) / 1000;
      if (bt > 0 && bt < BAL_CYCLE) rY = balloonH(bt) + 0.18;
    }
    r.group.position.set(r.cur.x, groundH(r.cur.x, r.cur.z) + rY + fx.yOff, r.cur.z);
    r.group.rotation.y = r.cur.yaw + Math.PI;
    r.inner.rotation.x = fx.bowX;
    r.inner.rotation.z = fx.rockZ;
    r.inner.rotation.y = fx.spinY;
    if (r.bubble && now > r.bubbleUntil) {
      r.group.remove(r.bubble); r.bubble = null;
    }
  }
  // v4.1: Bar AQUA の水槽の魚がゆっくり泳ぐ (水槽の長さに合わせて往復)
  // 魚の形はワールド座標で焼き込まれているので、反転は魚の中心まわりに補正して回す
  if (fish && fishBase && fishC) {
    const ft = now * 0.001;
    const targetRot = (Math.cos(ft * 0.45) >= 0 ? 0 : Math.PI);
    let dr = targetRot - fishRotY;
    while (dr > Math.PI) dr -= Math.PI * 2;
    while (dr < -Math.PI) dr += Math.PI * 2;
    fishRotY += dr * 0.04;
    const c = Math.cos(fishRotY), s = Math.sin(fishRotY);
    fish.rotation.y = fishRotY;
    fish.position.set(
      fishBase.x + fishC.x - (fishC.x * c + fishC.z * s) + Math.sin(ft * 0.45) * 0.45,
      fishBase.y + Math.sin(ft * 0.9) * 0.03,
      fishBase.z + fishC.z - (-fishC.x * s + fishC.z * c)
    );
  }
  // v4.2: 星のまたたき (2層を別々の速さでゆらす)
  if (starLayers.length) {
    const st = clock.elapsedTime;
    for (const s of starLayers) s.m.opacity = s.baseOp * (0.82 + 0.18 * Math.sin(st * s.speed + s.phase));
  }
  // v4.5: プレイランド (観覧車はゆっくり回り、ゴンドラは常に水平。メリーゴーラウンド回転、バイキングは揺れる)
  {
    const pt = now * 0.001;
    if (koiP) { koiP.rotation.y = pt * 0.25; koiP.position.y = Math.sin(pt * 1.7) * 0.008; }   // v5.3: 鯉が池をゆっくり回る
    if (playWheelP) {
      const th = pt * 0.3;
      playWheelP.rotation.z = th;
      for (const g of playGondolas) {
        const a = g.phi + th;
        g.mesh.position.set(
          g.base.x + PLAY_HUB.x + PLAY_WR * Math.cos(a) - g.c.x,
          g.base.y + PLAY_HUB.y + PLAY_WR * Math.sin(a) - PLAY_GK - g.c.y,
          g.base.z + PLAY_HUB.z - g.c.z
        );
      }
    }
    if (playCarP) playCarP.rotation.y = pt * 0.5;
    if (playVikP) playVikP.rotation.x = 0.45 * Math.sin(pt * 1.25);
  }
  // v4.3: 花火の進行
  updateFireworks(dt);
  // v4.8: 流れ星の進行
  updateMeteors(performance.now());
  // NPC (v3.14): 街の住人の自律行動
  updateNpcs(now, dt);
  renderer.render(scene, camera);
}

// エモートの進行度から、その人の今のオフセットを計算する (手続き的モーション)
// 戻り値: {yOff, bowX, rockZ}。終わったら r.emote を片付ける
const Z_AXIS = new THREE.Vector3(0, 0, 1);
function emoteFrame(r, now) {
  const out = { yOff: 0, bowX: 0, rockZ: 0, spinY: 0 };
  if (!r.emote) return out;
  const t = (now - r.emote.t0) / 1000;
  const name = r.emote.name;
  if (name === 'jump') {
    if (t >= 0.45) { r.emote = null; return out; }
    out.yOff = 0.25 * Math.sin(Math.PI * t / 0.45);
  } else if (name === 'bow') {
    if (t >= 1.0) { r.emote = null; return out; }
    // 体全体を前 (ローカル+Z) へ傾ける。inner の回転なので向き (yaw+π) の影響を受けない
    out.bowX = THREE.MathUtils.degToRad(28) * Math.sin(Math.PI * t / 1.0);
  } else if (name === 'raise') {
    if (t >= 1.2) { restoreArm(r); r.emote = null; return out; }
    let k;
    if (t < 0.25) { const u = t / 0.25; k = 1 - (1 - u) * (1 - u); }
    else if (t < 0.9) k = 1;
    else k = 1 - (t - 0.9) / 0.3;
    if (r.armParts.length && r.armPivot) {
      let ang = THREE.MathUtils.degToRad(135) * k;
      if (t >= 0.25 && t < 0.9) ang += Math.sin((t - 0.25) * 14) * 0.09; // 挙げた手を小さく振る
      applyArmRaise(r, ang);
    } else {
      // 腕パーツが無いモデル用のフォールバック: 体を小さく左右に揺らす
      out.rockZ = Math.sin(t * 10) * 0.12 * k;
      out.yOff = Math.abs(Math.sin(t * 10)) * 0.03 * k;
    }
  } else if (name === 'joy') {
    // よろこぶ: 両手を2回上げ下げしながら、その場で1周回る (1.6秒)
    if (t >= 1.6) { restoreArm(r); r.emote = null; return out; }
    out.spinY = Math.PI * 2 * (t / 1.6);
    const f = (1 - Math.cos(Math.PI * 4 * t / 1.6)) / 2; // 0→1→0→1→0
    const ang = THREE.MathUtils.degToRad(140) * f;
    if (r.armParts.length && r.armPivot) applyArmRaise(r, ang);
    if (r.armPartsL && r.armPartsL.length && r.armPivotL) applyArmRaiseL(r, ang);
    if (!r.armParts.length && !(r.armPartsL && r.armPartsL.length)) {
      out.rockZ = Math.sin(t * 10) * 0.12; // フォールバック: 体を揺らす (回転はする)
    }
  }
  return out;
}
function applyArmRaise(r, ang) {
  const q = new THREE.Quaternion().setFromAxisAngle(Z_AXIS, ang);
  const tmp = new THREE.Vector3();
  for (const part of r.armParts) {
    tmp.copy(part.pos0).sub(r.armPivot).applyQuaternion(q).add(r.armPivot);
    part.node.position.copy(tmp);
    part.node.quaternion.copy(q).multiply(part.quat0);
  }
}
function applyArmRaiseL(r, ang) {
  const q = new THREE.Quaternion().setFromAxisAngle(Z_AXIS, -ang); // 左腕は鏡像なので符号反転
  const tmp = new THREE.Vector3();
  for (const part of r.armPartsL) {
    tmp.copy(part.pos0).sub(r.armPivotL).applyQuaternion(q).add(r.armPivotL);
    part.node.position.copy(tmp);
    part.node.quaternion.copy(q).multiply(part.quat0);
  }
}
function restoreArm(r) {
  for (const part of r.armParts) {
    part.node.position.copy(part.pos0);
    part.node.quaternion.copy(part.quat0);
  }
  if (r.armPartsL) for (const part of r.armPartsL) {
    part.node.position.copy(part.pos0);
    part.node.quaternion.copy(part.quat0);
  }
}

// ---------------- NPC (v3.14): 街の住人 ----------------
// サーバーとは通信せず、各クライアントの中で自律的に動く (見る人ごとに位置は少し違う)。
// 訪問者よりひと回り小さく (0.8倍)、決まった範囲をうろうろ歩き、ときどき勝手にエモートする
const npcs = [];
const NPC_DEFS = [
  { avatarType: 'girl', avatarColor: 'red',    home: { x: -19.6, z: 23.3 }, r: 1.5 },  // 商店街・花屋の前
  { avatarType: 'boy',  avatarColor: 'green',  home: { x: -17.9, z: 23.7 }, r: 1.3 },  // 商店街・ゲーセンの前
  { avatarType: 'girl', avatarColor: 'blue',   home: { x: -16.2, z: 23.4 }, r: 1.1 },  // 商店街・アーチのそば
  { avatarType: 'girl', avatarColor: 'yellow', home: { x: -21.3, z: -0.4 }, r: 2.0 },  // 公園・噴水のそば
  { avatarType: 'boy',  avatarColor: 'yellow', home: { x: -24.4, z: 5.4 },  r: 2.2 },  // 公園の西側 (v3.17: 桜を避けて少し東へ)
];
function ensureNpcs() {
  if (npcs.length) return;
  const now = performance.now();
  for (const d of NPC_DEFS) {
    const n = createAvatar(
      { avatarType: d.avatarType, avatarColor: d.avatarColor, name: '', isHost: false, x: d.home.x, z: d.home.z, yaw: Math.random() * Math.PI * 2, emoteAt: 0 },
      true
    );
    n.group.scale.setScalar(0.8);
    n.home = d.home; n.homeR = d.r;
    n.faceYaw = n.cur.yaw;
    n.state = 'idle';
    n.waitUntil = now + 1000 + Math.random() * 3000;
    n.nextEmoteAt = now + 5000 + Math.random() * 12000;
    n.tx = d.home.x; n.tz = d.home.z;
    n.stuckAt = 0; n.lastX = d.home.x; n.lastZ = d.home.z;
    npcs.push(n);
  }
}
const NPC_EMOTES = ['raise', 'raise', 'joy', 'bow', 'joy', 'jump'];
function npcTargetOk(x, z) {
  if (!inRegion(x, z)) return false;
  for (const [x0, x1, z0, z1] of BOXES) {
    if (x > x0 - 0.35 && x < x1 + 0.35 && z > z0 - 0.35 && z < z1 + 0.35) return false;
  }
  return true;
}
function updateNpcs(now, dt) {
  for (const n of npcs) {
    let bob = 0;
    if (n.state === 'idle') {
      if (now >= n.nextEmoteAt && !n.emote) {
        n.emote = { name: NPC_EMOTES[(Math.random() * NPC_EMOTES.length) | 0], t0: now };
        n.faceYaw = Math.random() * Math.PI * 2; // エモートのたびに適当な方を向く
        n.nextEmoteAt = now + 9000 + Math.random() * 14000;
      }
      if (now >= n.waitUntil) {
        // 行き先は「物のある場所」を避けて選ぶ (何度か試してダメなら今回は休憩のまま)
        let ok = false;
        for (let i = 0; i < 8 && !ok; i++) {
          const a = Math.random() * Math.PI * 2, d = Math.sqrt(Math.random()) * n.homeR;
          const cx = n.home.x + Math.cos(a) * d, cz = n.home.z + Math.sin(a) * d;
          if (npcTargetOk(cx, cz)) { n.tx = cx; n.tz = cz; ok = true; }
        }
        if (!ok) { n.waitUntil = now + 1200; }
        else {
          if (n.emote) { restoreArm(n); n.emote = null; } // 歩き出す時はエモートを片付ける
          n.state = 'walk';
          n.stuckAt = now; n.lastX = n.cur.x; n.lastZ = n.cur.z;
        }
      }
    } else { // walk: 目標へゆっくり歩く (当たり判定は訪問者と同じ collide を使う)
      const dx = n.tx - n.cur.x, dz = n.tz - n.cur.z;
      const dist = Math.hypot(dx, dz);
      if (dist < 0.08) {
        n.state = 'idle';
        n.waitUntil = now + 1500 + Math.random() * 3500;
      } else {
        n.faceYaw = Math.atan2(-dx, -dz);
        const step = Math.min(0.55 * dt, dist);
        const [nx, nz] = collide(n.cur.x + dx / dist * step, n.cur.z + dz / dist * step);
        n.cur.x = nx; n.cur.z = nz;
        bob = Math.abs(Math.sin(now * 0.012)) * 0.03; // 歩行の小さな上下動
        if (now - n.stuckAt > 1200) { // 物に引っかかって進めていない時はあきらめて休憩
          if (Math.hypot(n.cur.x - n.lastX, n.cur.z - n.lastZ) < 0.05) {
            n.state = 'idle';
            n.waitUntil = now + 1000 + Math.random() * 2000;
          }
          n.stuckAt = now; n.lastX = n.cur.x; n.lastZ = n.cur.z;
        }
      }
    }
    let dy = n.faceYaw - n.cur.yaw;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    n.cur.yaw += dy * 0.15;
    const fx = emoteFrame(n, now);
    n.group.position.set(n.cur.x, groundH(n.cur.x, n.cur.z) + fx.yOff + bob, n.cur.z);
    n.group.rotation.y = n.cur.yaw + Math.PI;
    n.inner.rotation.x = fx.bowX;
    n.inner.rotation.z = fx.rockZ;
    n.inner.rotation.y = fx.spinY;
  }
}

// ---------- メリーゴーラウンド乗車 (v4.6): 近づくとボタン、一番近い馬の横に立って一緒に回る ----------
function mountCarousel() {
  const pt = performance.now() * 0.001;
  const pp = Math.atan2(pos.z - CAR_C.z, pos.x - CAR_C.x);
  let best = 0, bd = 1e9;
  for (let i = 0; i < 6; i++) {
    const phi = -i * Math.PI / 3 - 0.5 * pt;   // 馬の今の角度 (本体の回転と同じ式)
    const dd = Math.abs(((pp - phi) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI);
    if (dd < bd) { bd = dd; best = i; }
  }
  ride = { ha: best * Math.PI / 3 };
}
function dismountCarousel() {
  if (!ride) return;
  const pt = performance.now() * 0.001;
  const phi0 = -ride.ha - 0.5 * pt;
  ride = null; rideY = 0;
  for (let k = 0; k < 12; k++) {   // 今の角度から順に、物にぶつからない降り場所を探す
    const phi = phi0 + k * Math.PI / 6;
    const nx = CAR_C.x + 3.45 * Math.cos(phi), nz = CAR_C.z + 3.45 * Math.sin(phi);
    if (!inRegion(nx, nz)) continue;
    let hit = false;
    for (const b of BOXES) if (nx > b[0] - 0.3 && nx < b[1] + 0.3 && nz > b[2] - 0.3 && nz < b[3] + 0.3) { hit = true; break; }
    if (!hit) { pos.x = nx; pos.z = nz; return; }
  }
  pos.x = CAR_C.x; pos.z = CAR_C.z + 3.45;   // 最終手段は真南
}
$('rideBtn').onclick = () => { if (ride) dismountCarousel(); else mountCarousel(); };

// ---------- 花火 (v4.3): 山頂のボタンで発射、全員の画面に上がる ----------
const fwFx = [];   // 進行中の花火
const FW_COLORS = [0xffc740, 0xff7396, 0x73bfff, 0x7dff9e, 0xd9a5ff];

function startFwShow() {
  // v4.3.1: 上がる場所は山の真上ではなく公園 (StarryApa方向) の上空に。山頂から見下ろして見える位置
  for (let i = 0; i < 8; i++) {
    fwFx.push({
      kind: 'shell', t: -i * 0.35,
      x: -25 + (Math.random() * 8 - 4), z: -0.5 + (Math.random() * 6 - 3),
      topY: 20 + Math.random() * 7,
      color: FW_COLORS[i % FW_COLORS.length], ring: i === 5, big: i === 7,
      pts: null, vel: null, age: 0, life: 2.4
    });
  }
}

function fwMakePoints(n, color, size, sizeAttenuation) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const m = new THREE.PointsMaterial({ color, size, sizeAttenuation, transparent: true,
    depthWrite: false, blending: THREE.AdditiveBlending });
  const p = new THREE.Points(g, m);
  p.frustumCulled = false;
  scene.add(p);
  return p;
}

function fwBoom(big) {
  // v4.3.2: 花火の音 (低いドン＋破裂のノイズ＋遅れてパチパチ)。ドアベルと同じ audioCtx を使う
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    const vol = big ? 0.55 : 0.38;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(130, t0);
    o.frequency.exponentialRampToValueAtTime(38, t0 + 0.45);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.7);
    o.connect(g).connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + 0.75);
    const nb = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.35), audioCtx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nd.length);
    const ns = audioCtx.createBufferSource(); ns.buffer = nb;
    const nf = audioCtx.createBiquadFilter(); nf.type = 'lowpass'; nf.frequency.value = 900;
    const ng = audioCtx.createGain();
    ng.gain.setValueAtTime(vol * 0.7, t0);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    ns.connect(nf).connect(ng).connect(audioCtx.destination);
    ns.start(t0);
    for (let i = 0; i < 7; i++) {
      const dt = 0.15 + Math.random() * 1.1;
      const cb = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.03), audioCtx.sampleRate);
      const cd = cb.getChannelData(0);
      for (let j = 0; j < cd.length; j++) cd[j] = (Math.random() * 2 - 1) * (1 - j / cd.length);
      const cs = audioCtx.createBufferSource(); cs.buffer = cb;
      const cf = audioCtx.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 1800 + Math.random() * 1800; cf.Q.value = 1.2;
      const cg = audioCtx.createGain(); cg.gain.value = 0.05 + Math.random() * 0.05;
      cs.connect(cf).connect(cg).connect(audioCtx.destination);
      cs.start(t0 + dt);
    }
  } catch (e) {}
}

function fwBurst(fx) {
  fwBoom(fx.big);
  // v4.3.1: 粒を増やして大きく開く+中心の閃光と内側の芯でもう少し豪華に
  const flash = { kind: 'flash', t: 0, x: fx.x, topY: fx.topY, z: fx.z, color: 0xffffff,
                  pts: fwMakePoints(1, 0xffffff, 30, false), vel: null, age: 0, life: 0.3 };
  flash.pts.geometry.attributes.position.array.set([fx.x, fx.topY, fx.z]);
  flash.pts.geometry.attributes.position.needsUpdate = true;
  fwFx.push(flash);
  const layers = fx.ring
    ? [{ n: 170, spMin: 8.0, spVar: 2.0, size: 0.7, life: 2.4, tint: 0 }]
    : [{ n: fx.big ? 260 : 170, spMin: 5.0, spVar: 5.0, size: 0.7, life: 2.4, tint: 0 },
       { n: 70, spMin: 1.8, spVar: 2.0, size: 0.6, life: 1.7, tint: 0.55 }];
  let first = true;
  for (const L of layers) {
    const col = new THREE.Color(fx.color);
    if (L.tint) col.lerp(new THREE.Color(0xffffff), L.tint);
    const pts = fwMakePoints(L.n, col.getHex(), L.size, true);
    const posA = pts.geometry.attributes.position.array;
    const vel = new Float32Array(L.n * 3);
    for (let i = 0; i < L.n; i++) {
      posA[i * 3] = fx.x; posA[i * 3 + 1] = fx.topY; posA[i * 3 + 2] = fx.z;
      if (fx.ring) {   // 輪の形に開く
        const a = (i / L.n) * Math.PI * 2, sp = L.spMin + Math.random() * L.spVar;
        vel[i * 3] = Math.cos(a) * sp; vel[i * 3 + 1] = (Math.random() - 0.5) * 0.8; vel[i * 3 + 2] = Math.sin(a) * sp;
      } else {
        const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
        const sp = L.spMin + Math.random() * L.spVar;
        vel[i * 3] = Math.sin(ph) * Math.cos(th) * sp;
        vel[i * 3 + 1] = Math.cos(ph) * sp;
        vel[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * sp;
      }
    }
    if (first) { fx.kind = 'burst'; fx.pts = pts; fx.vel = vel; fx.age = 0; fx.life = L.life; first = false; }
    else fwFx.push({ kind: 'burst', t: 0, x: fx.x, topY: fx.topY, z: fx.z, color: fx.color,
                     pts, vel, age: 0, life: L.life });
  }
}

function fwDispose(fx) {
  if (fx.pts) { scene.remove(fx.pts); fx.pts.geometry.dispose(); fx.pts.material.dispose(); fx.pts = null; }
}

function updateFireworks(dt) {
  for (let i = fwFx.length - 1; i >= 0; i--) {
    const fx = fwFx[i];
    fx.t += dt;
    if (fx.t < 0) continue;
    if (fx.kind === 'shell') {
      if (!fx.pts) fx.pts = fwMakePoints(1, fx.color, 6, false);
      const k = Math.min(fx.t / 0.95, 1);
      const y = 1.0 + (fx.topY - 1.0) * (1 - Math.pow(1 - k, 3));
      const posA = fx.pts.geometry.attributes.position.array;
      posA[0] = fx.x; posA[1] = y; posA[2] = fx.z;
      fx.pts.geometry.attributes.position.needsUpdate = true;
      if (k >= 1) { fwDispose(fx); fwBurst(fx); }
    } else if (fx.kind === 'flash') {
      fx.age += dt;
      fx.pts.material.opacity = Math.max(0, 1 - fx.age / fx.life);
      if (fx.age >= fx.life) { fwDispose(fx); fwFx.splice(i, 1); }
    } else {
      fx.age += dt;
      const posA = fx.pts.geometry.attributes.position.array;
      const drag = Math.max(0, 1 - 0.4 * dt);
      for (let j = 0; j < fx.vel.length; j += 3) {
        fx.vel[j] *= drag; fx.vel[j + 2] *= drag;
        fx.vel[j + 1] = fx.vel[j + 1] * drag - 2.0 * dt;
        posA[j] += fx.vel[j] * dt; posA[j + 1] += fx.vel[j + 1] * dt; posA[j + 2] += fx.vel[j + 2] * dt;
      }
      fx.pts.geometry.attributes.position.needsUpdate = true;
      fx.pts.material.opacity = Math.max(0, 1 - fx.age / fx.life);
      if (fx.age >= fx.life) { fwDispose(fx); fwFx.splice(i, 1); }
    }
  }
}

function craneJudge(dx, hard) {   // つかみ判定 (v5.2: 本物寄りに厳しく): 中心が合えば必ず、近ければ半分 (重い景品はさらに難しい)
  const a = Math.abs(dx);
  if (hard) { if (a <= 8) return true; if (a <= 18) return Math.random() < 0.4; return false; }
  if (a <= 10) return true;
  if (a <= 22) return Math.random() < 0.5;
  return false;
}
function craneNewPrize(x, hasSwitch) {
  let t;
  if (!hasSwitch && Math.random() < 0.08) t = PRIZE_TYPES[6];   // レア景品スイッチ2 (8%、台の中に最大1つ)
  else t = PRIZE_TYPES[Math.floor(Math.random() * 6)];
  return { x, y: 230, type: t.id, name: t.name, color: t.color, held: false, gone: false };
}
function craneResetPrizes() {
  const out = [];
  let hasSwitch = false;
  for (const x of [78, 128, 178, 228, 278, 322]) {
    const p = craneNewPrize(x + (Math.random() * 10 - 5), hasSwitch);
    if (p.type === 'switch2') hasSwitch = true;
    out.push(p);
  }
  return out;
}
function craneBagText() {
  const parts = [];
  for (const t of PRIZE_TYPES) if (craneBag[t.id]) parts.push(t.short + '×' + craneBag[t.id]);
  return parts.length ? 'とった景品: ' + parts.join('・') : 'とった景品: まだなし';
}
function craneJingle() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime;
    for (const [f, dt] of [[523.25, 0], [659.25, 0.09], [783.99, 0.18], [1046.5, 0.27]]) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + dt + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.35);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + dt); o.stop(t0 + dt + 0.4);
    }
  } catch (e) {}
}
function openCrane() {
  for (const k in keys) keys[k] = false;
  craneOpen = true;
  $('cranePanel').classList.remove('hidden');
  $('craneBtn').classList.add('hidden');
  crane = { prizes: craneResetPrizes(), x: CR.homeX, y: CR.restY, phase: 'ready', phaseT: 0,
            sway: 0, swayV: 0, held: null, willHold: false, moving: false, target: null,
            targetY: 238, gx: CR.homeX, raf: 0, lastTs: performance.now(), lastPhase: '' };
  $('craneMsg').textContent = '「いどう」を長押しでクレーンを動かして、離したら「つかむ」を押してね';
  $('craneBag').textContent = craneBagText();
  crane.raf = requestAnimationFrame(craneTick);
}
function closeCrane() {
  craneOpen = false;
  $('cranePanel').classList.add('hidden');
  if (crane && crane.raf) cancelAnimationFrame(crane.raf);
  crane = null;
}
function craneStartDrop() {
  const c = crane;
  if (!c || c.phase !== 'ready') return;
  c.moving = false;
  c.gx = c.x + Math.sin(c.sway) * 40;
  let best = null, bd = 1e9;
  for (const p of c.prizes) {
    if (p.gone || p.falling) continue;
    const d = Math.abs(p.x - c.gx);
    if (d < bd) { bd = d; best = p; }
  }
  c.target = (best && bd <= 44) ? best : null;
  if (c.target) c.target.homeX = c.target.x;   // v4.4.2: 補充位置は「取れた場所」ではなく元の置き場所
  c.targetY = c.target ? c.target.y - 30 : 238;
  c.phase = 'drop'; c.phaseT = 0;
}
function craneTick(ts) {
  if (!crane) return;
  crane.raf = requestAnimationFrame(craneTick);
  const c = crane;
  const dt = Math.min((ts - c.lastTs) / 1000, 0.05); c.lastTs = ts;
  // 振り子のゆれ: 動いている間は遅れて傾き、止まると揺れながら収まる
  const swayTarget = (c.moving && c.phase === 'ready') ? -0.17 : 0;
  c.swayV += ((swayTarget - c.sway) * 26 - c.swayV * (c.moving ? 4 : 1.6)) * dt;
  c.sway += c.swayV * dt;
  if (c.phase === 'ready') {
    if (c.moving) c.x = Math.min(c.x + 135 * dt, CR.maxX);
  } else if (c.phase === 'drop') {
    c.y += 155 * dt;
    if (c.y >= c.targetY) {
      c.y = c.targetY; c.phase = 'close'; c.phaseT = 0;
      c.willHold = c.target ? craneJudge(c.gx - c.target.x, c.target.type === 'switch2') : false;
    }
  } else if (c.phase === 'close') {
    c.phaseT += dt;
    if (c.phaseT >= 0.45) {
      if (c.willHold && c.target) {
        c.held = c.target; c.target.held = true;
        // v5.2: 運ぶ途中で滑り落ちることがある (本物のアームの弱さ)。落ちる位置を先に決めておく
        const slipP = c.target.type === 'switch2' ? 0.45 : 0.30;
        c.slipAtX = (Math.random() < slipP) ? CR.chuteX + (c.x - CR.chuteX) * (0.3 + Math.random() * 0.4) : null;
      }
      else if (c.target) $('craneMsg').textContent = 'おしい！ すべっちゃった…';
      else $('craneMsg').textContent = 'なにもなかった…';
      c.phase = 'rise';
    }
  } else if (c.phase === 'rise') {
    c.y -= 175 * dt;
    if (c.y <= CR.restY) { c.y = CR.restY; c.phase = 'return'; }
  } else if (c.phase === 'return') {
    c.x -= 200 * dt;
    if (c.held && c.slipAtX != null && c.x <= c.slipAtX) {   // v5.2: 途中で滑り落ちた
      const p = c.held; p.held = false; p.falling = true; p.vy = 0; c.held = null; c.slipAtX = null;
      $('craneMsg').textContent = 'あっ…途中で落ちちゃった';
    }
    if (c.x <= CR.chuteX) { c.x = CR.chuteX; c.phase = c.held ? 'release' : 'backhome'; c.phaseT = 0; }
  } else if (c.phase === 'release') {
    c.phaseT += dt;
    if (c.held) {
      c.held.y += 320 * dt;
      if (c.held.y >= 238) {
        const got = c.held; got.gone = true; got.held = false; c.held = null;
        craneBag[got.type] = (craneBag[got.type] || 0) + 1;
        try { localStorage.setItem('starryCraneBag', JSON.stringify(craneBag)); } catch (e) {}
        $('craneBag').textContent = craneBagText();
        $('craneMsg').textContent = got.type === 'switch2' ? 'すごい！！ ゲーム機（スイッチ2）をとれた！🎉' : 'とれた！ ' + got.name + ' 🎉';
        craneJingle();
        c.prizes.push(craneNewPrize(got.homeX != null ? got.homeX : got.x, c.prizes.some(p => p.type === 'switch2' && !p.gone)));
      }
    }
    if ((!c.held && c.phaseT >= 0.3) || c.phaseT >= 1.2) c.phase = 'backhome';
  } else if (c.phase === 'backhome') {
    c.x += 200 * dt;
    if (c.x >= CR.homeX) {
      c.x = CR.homeX; c.phase = 'ready';
      if (!c.held) $('craneMsg').textContent = 'もう一回どうぞ。「いどう」長押し→「つかむ」';
    }
  }
  for (const p of c.prizes) {   // v5.2: 落ちた景品は台の床まで落ちる
    if (p.falling) { p.vy += 900 * dt; p.y += p.vy * dt; if (p.y >= 230) { p.y = 230; p.falling = false; } }
  }
  if (c.held && c.phase !== 'release') { c.held.x = c.x + Math.sin(c.sway) * 40; c.held.y = c.y + 34; }
  if (c.phase !== c.lastPhase) {
    c.lastPhase = c.phase;
    const ready = c.phase === 'ready';
    $('btnCraneMove').disabled = !ready;
    $('btnCraneDrop').disabled = !ready;
  }
  craneDraw();
}
function craneDrawPrize(g, p) {
  if (!p.held) {   // 影
    g.fillStyle = 'rgba(0,0,0,0.30)';
    g.beginPath(); g.ellipse(p.x, 250, 20, 5, 0, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = p.color;
  g.strokeStyle = 'rgba(60,30,10,0.45)'; g.lineWidth = 2;
  const x = p.x, y = p.y;
  if (p.type === 'hoshi') {
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 === 0 ? 21 : 9, a = -Math.PI / 2 + i * Math.PI / 5;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      i === 0 ? g.moveTo(px, py) : g.lineTo(px, py);
    }
    g.closePath(); g.fill(); g.stroke();
  } else if (p.type === 'tsuki') {
    g.beginPath(); g.arc(x, y, 19, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#2b2136';
    g.beginPath(); g.arc(x + 8, y - 5, 15, 0, Math.PI * 2); g.fill();
    g.fillStyle = p.color;
  } else if (p.type === 'sakana') {
    g.beginPath(); g.moveTo(x + 16, y); g.lineTo(x + 28, y - 11); g.lineTo(x + 28, y + 11); g.closePath(); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(x, y, 20, 14, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    g.fillStyle = '#26303c';
    g.beginPath(); g.arc(x - 9, y - 2, 2.4, 0, Math.PI * 2); g.fill();
    return;
  } else if (p.type === 'switch2') {
    const cy = y + 9;
    const rr = (x0, y0, w, h, r) => { g.beginPath(); g.moveTo(x0 + r, y0); g.arcTo(x0 + w, y0, x0 + w, y0 + h, r); g.arcTo(x0 + w, y0 + h, x0, y0 + h, r); g.arcTo(x0, y0 + h, x0, y0, r); g.arcTo(x0, y0, x0 + w, y0, r); g.closePath(); };
    rr(x - 27, cy - 13, 54, 26, 9); g.fillStyle = '#3a3f4a'; g.fill(); g.stroke();
    g.fillStyle = '#00c3e3'; g.fillRect(x - 26, cy - 10, 10, 20);
    g.fillStyle = '#ff5a4d'; g.fillRect(x + 16, cy - 10, 10, 20);
    g.fillStyle = '#bfe8ff'; g.fillRect(x - 14, cy - 9, 28, 18);
    g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(x - 14, cy - 9, 28, 5);
    g.fillStyle = '#20242c';
    g.beginPath(); g.arc(x - 21, cy - 3, 2.6, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(x + 21, cy - 4, 1.8, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(x + 24, cy + 1, 1.8, 0, Math.PI * 2); g.fill();
    g.beginPath(); g.arc(x + 18, cy + 1, 1.8, 0, Math.PI * 2); g.fill();
    return;
  } else {
    if (p.type === 'kuma') {
      for (const s of [-1, 1]) { g.beginPath(); g.arc(x + s * 13, y - 15, 7, 0, Math.PI * 2); g.fill(); g.stroke(); }
    } else if (p.type === 'neko') {
      for (const s of [-1, 1]) { g.beginPath(); g.moveTo(x + s * 8, y - 13); g.lineTo(x + s * 16, y - 24); g.lineTo(x + s * 17, y - 10); g.closePath(); g.fill(); g.stroke(); }
    } else if (p.type === 'usagi') {
      for (const s of [-1, 1]) { g.beginPath(); g.ellipse(x + s * 9, y - 24, 5, 12, s * 0.15, 0, Math.PI * 2); g.fill(); g.stroke(); }
    }
    g.beginPath(); g.arc(x, y, 19, 0, Math.PI * 2); g.fill(); g.stroke();
  }
  // 顔
  g.fillStyle = '#26303c';
  g.beginPath(); g.arc(x - 6.5, y - 2, 2.2, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(x + 6.5, y - 2, 2.2, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#26303c'; g.lineWidth = 1.6;
  g.beginPath(); g.arc(x, y + 3.5, 4, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
}
function craneDraw() {
  const c = crane; if (!c) return;
  const g = $('craneCanvas').getContext('2d');
  g.clearRect(0, 0, 360, 300);
  const grad = g.createLinearGradient(0, 0, 0, 300);
  grad.addColorStop(0, '#3a2c4e'); grad.addColorStop(1, '#241a33');
  g.fillStyle = grad; g.fillRect(0, 0, 360, 300);
  // 取り出し口 (左下)
  g.fillStyle = '#191021'; g.fillRect(4, 188, 50, 64);
  g.strokeStyle = 'rgba(230,200,255,0.5)'; g.lineWidth = 2; g.strokeRect(4, 188, 50, 64);
  g.fillStyle = '#cdbcf0'; g.font = '10px sans-serif'; g.fillText('とりくち', 10, 182);
  // 床と前面パネル
  g.fillStyle = '#17101f'; g.fillRect(0, CR.floorY, 360, 48);
  g.fillStyle = '#55306b'; g.fillRect(0, 268, 360, 32);
  g.fillStyle = '#ffd94d'; g.beginPath(); g.arc(330, 284, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#2b2136'; g.fillRect(300, 280, 16, 8);
  // 景品
  for (const p of c.prizes) if (!p.gone && !p.held) craneDrawPrize(g, p);
  if (c.held) craneDrawPrize(g, c.held);
  // レールとクレーン
  g.fillStyle = '#120c1a'; g.fillRect(0, CR.railY - 6, 360, 10);
  g.fillStyle = '#8d6bb5'; g.fillRect(c.x - 13, CR.railY - 9, 26, 14);
  const gx = c.x + Math.sin(c.sway) * 40;
  g.strokeStyle = '#d9c8f5'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(c.x, CR.railY + 4); g.lineTo(gx, c.y); g.stroke();
  const open = (c.phase === 'ready' || c.phase === 'drop') ? 9 : 3;
  g.fillStyle = '#e8ddfa'; g.beginPath(); g.arc(gx, c.y, 5, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#e8ddfa'; g.lineWidth = 3;
  for (const s of [-1, 0, 1]) {
    g.beginPath(); g.moveTo(gx + s * 4, c.y + 2);
    g.lineTo(gx + s * open + s * 3, c.y + 16);
    g.lineTo(gx + s * open - (s === 0 ? 0 : s * 4), c.y + 23);
    g.stroke();
  }
  // ガラスのツヤ
  g.fillStyle = 'rgba(255,255,255,0.05)';
  g.beginPath(); g.moveTo(40, 0); g.lineTo(120, 0); g.lineTo(60, 300); g.lineTo(0, 300); g.lineTo(0, 60); g.closePath(); g.fill();
}
$('craneBtn').onclick = openCrane;
$('btnCraneClose').onclick = closeCrane;
$('btnCraneDrop').onclick = craneStartDrop;
{
  const mb = $('btnCraneMove');
  const on = e => { e.preventDefault(); if (crane && crane.phase === 'ready') crane.moving = true; };
  const off = () => { if (crane) crane.moving = false; };
  mb.addEventListener('pointerdown', on);
  mb.addEventListener('pointerup', off);
  mb.addEventListener('pointerleave', off);
  mb.addEventListener('pointercancel', off);
}

// FF14式: 部屋の中で Enter を押したらチャット入力にフォーカス (v3.4)
addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !inRoom || chatFocused || craneOpen) return;
  const ae = document.activeElement;
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && ae !== $('chatInput')) return;
  e.preventDefault();
  if (ae && ae.tagName === 'BUTTON') ae.blur();
  $('chatInput').focus();
});

// ---------------- エモート ----------------
let lastEmoteSentAt = 0;
let myEmote = null; // 自分のエモートの視点フィードバック用 {name, t0} (v3.4.2)
function doEmote(name) {
  if (!inRoom || !me) return;
  const now = performance.now();
  if (now - lastEmoteSentAt < 400) return; // 連打防止
  lastEmoteSentAt = now;
  // 自分のアバターにも同じエモートを付ける (三人称で見える。一人称では非表示なだけで害はない)
  if (selfAvatar) {
    restoreArm(selfAvatar); // 前の「手をあげる」が途中でも腕を戻してから次へ (リモートと同じ)
    selfAvatar.emote = { name, t0: now };
  }
  // 視点フィードバックは一人称の時だけ (三人称では人形の動きが見えるので付けない)
  if (!thirdPerson && (name === 'jump' || name === 'bow' || name === 'joy')) myEmote = { name, t0: now };
  apiAuth('/api/emote', { emote: name, x: pos.x, z: pos.z, yaw }).catch(() => {});
}
$('emoteRaise').onclick = () => doEmote('raise');
$('emoteJump').onclick = () => doEmote('jump');
$('emoteBow').onclick = () => doEmote('bow');
$('emoteJoy').onclick = () => doEmote('joy');

// ページを閉じる時に退室
addEventListener('pagehide', () => {
  if (token && inRoom) {
    try { navigator.sendBeacon('/api/leave', JSON.stringify({ token })); } catch (e) {}
  }
});

// ---------------- 起動 ----------------
(async () => {
  if (token) {
    const { data } = await api('/api/me', { token });
    if (data.account) { me = data.account; showLobby(); return; }
    token = null; localStorage.removeItem(TOKEN_KEY);
  }
  show('authScreen');
})();
